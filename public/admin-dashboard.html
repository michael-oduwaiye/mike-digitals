<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mike Digitals — Admin</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root {
    --bg: #0A0E1A; --bg-card: #121729; --border: #232B45;
    --amber: #FFB627; --green: #3DDC97; --red: #FF6B6B;
    --text: #E8EAF0; --text-muted: #8B93A7; --text-faint: #4E5670;
    --font-display: 'Space Grotesk', sans-serif; --font-body: 'Inter', sans-serif; --font-mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
  }

  .wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 28px 18px 60px;
  }

  .login-screen {
    max-width: 340px;
    margin: 100px auto;
    text-align: center;
  }

  .login-screen h1 {
    font-family: var(--font-display);
    font-size: 22px;
    margin-bottom: 20px;
  }

  .login-screen input {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 14px;
    color: var(--text);
    font-family: var(--font-mono);
    margin-bottom: 12px;
    outline: none;
  }

  .login-screen input:focus {
    border-color: var(--amber);
  }

  .login-screen button {
    width: 100%;
    background: var(--amber);
    color: #1A1200;
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-family: var(--font-display);
    font-weight: 700;
    cursor: pointer;
  }

  .login-screen button:hover {
    opacity: 0.9;
  }

  .login-error {
    color: var(--red);
    font-size: 13px;
    margin-top: 10px;
  }

  .server-url-hint {
    color: var(--text-faint);
    font-size: 11px;
    margin-top: 18px;
    line-height: 1.5;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }

  header h1 {
    font-family: var(--font-display);
    font-size: 20px;
  }

  .header-actions {
    display: flex;
    gap: 8px;
  }

  .refresh-btn,
  .logout-btn {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }

  .refresh-btn:hover {
    color: var(--text);
    border-color: var(--amber);
  }

  .logout-btn:hover {
    color: var(--red);
    border-color: var(--red);
  }

  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 24px;
  }

  .summary-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }

  .summary-card .label {
    font-size: 11px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }

  .summary-card .value {
    font-family: var(--font-mono);
    font-size: 20px;
    font-weight: 600;
  }

  .summary-card.profit .value {
    color: var(--green);
  }

  .summary-card.review .value {
    color: var(--red);
  }

  .section-title {
    font-family: var(--font-display);
    font-size: 15px;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .plans-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 20px;
    margin-bottom: 10px;
  }

  .plans-heading .section-title {
    margin-bottom: 0;
  }

  .section-toggle {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }

  .section-toggle:hover {
    border-color: var(--amber);
  }

  .plans-panel[hidden] {
    display: none;
  }

  .order-row {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .order-row.flagged {
    border-color: var(--red);
    background: rgba(255,107,107,0.06);
  }

  .order-info {
    flex: 1;
    min-width: 0;
  }

  .order-plan {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 600;
  }

  .order-meta {
    font-size: 12px;
    color: var(--text-faint);
    margin-top: 3px;
  }

  .order-right {
    text-align: right;
    flex-shrink: 0;
  }

  .order-profit {
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--green);
  }

  .order-status {
    display: inline-block;
    font-size: 10.5px;
    padding: 3px 8px;
    border-radius: 6px;
    margin-top: 4px;
    font-family: var(--font-mono);
  }

  .status-delivered {
    background: rgba(61,220,151,0.12);
    color: var(--green);
  }

  .status-pending {
    background: rgba(255,182,39,0.12);
    color: var(--amber);
  }

  .status-failed,
  .status-partial {
    background: rgba(255,107,107,0.12);
    color: var(--red);
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-faint);
  }

  
.plan-row {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 8px;
  display: grid;
  grid-template-columns: minmax(120px, 1fr) auto auto;
  align-items: center;
  gap: 12px;
}

.plan-name {
  font-weight: 600;
  font-size: 13px;
}

.plan-meta {
  color: var(--text-muted);
  font-size: 12px;
  margin-top: 4px;
}

.plan-price {
  width: 105px;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 9px;
}

.plan-enabled {
  accent-color: var(--green);
}

.plan-save {
  background: var(--amber);
  color: #1A1200;
  border: none;
  border-radius: 7px;
  padding: 9px 12px;
  font-weight: 600;
  cursor: pointer;
}

.plan-save:disabled {
  opacity: 0.5;
  cursor: wait;
}

@media (max-width: 520px) {
  .plan-row {
    grid-template-columns: 1fr auto;
  }

  .plan-details {
    grid-column: 1 / -1;
  }

  .plans-heading {
    align-items: flex-start;
  }

  .section-toggle {
    padding: 8px 10px;
  }
}



  /* Mike Digitals professional dashboard refresh */
  :root {
    color-scheme: light;
    --bg: #f5f7fb;
    --bg-card: #ffffff;
    --border: #e7eaf0;
    --amber: #ff7417;
    --green: #16845b;
    --red: #d93636;
    --text: #182230;
    --text-muted: #596579;
    --text-faint: #7d8798;
    --font-display: 'Inter', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  body { background: var(--bg); color: var(--text); font-size: 14px; }
  .wrap { max-width: 1440px; padding: 28px clamp(16px, 3vw, 42px) 56px; }
  header { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px 24px; margin-bottom: 22px; box-shadow: 0 4px 18px rgba(22,34,51,.035); }
  header h1 { font-size: 22px; font-weight: 750; letter-spacing: -.6px; color: var(--text); }
  .header-actions { align-items: center; flex-wrap: wrap; }
  .refresh-btn, .logout-btn, .section-toggle { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted); border-radius: 9px; padding: 10px 14px; font-family: var(--font-body); font-size: 12px; font-weight: 650; transition: .18s ease; }
  .refresh-btn:hover, .section-toggle:hover { color: var(--amber); border-color: var(--amber); transform: translateY(-1px); }
  .logout-btn:hover { background: #fff1f0; }
  .theme-toggle { color: var(--text); }
  .summary-grid { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; margin-bottom: 26px; }
  .summary-card { position: relative; overflow: hidden; background: var(--bg-card); border: 1px solid var(--border); border-radius: 15px; padding: 22px; box-shadow: 0 4px 18px rgba(22,34,51,.035); }
  .summary-card::before { content: ""; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--amber); opacity: .9; }
  .summary-card .label { color: var(--text-faint); font-size: 11px; font-weight: 700; letter-spacing: .07em; margin-bottom: 12px; }
  .summary-card .value { color: var(--text); font-family: var(--font-display); font-size: clamp(20px, 2vw, 27px); font-weight: 750; letter-spacing: -.7px; overflow-wrap: anywhere; }
  .summary-card.profit .value { color: var(--green); }
  .summary-card.review .value { color: var(--red); }
  .section-title { color: var(--text); font-family: var(--font-display); font-size: 16px; font-weight: 750; margin-bottom: 13px; letter-spacing: -.2px; }
  .plans-heading { background: var(--bg-card); border: 1px solid var(--border); border-radius: 13px; padding: 17px 20px; margin-top: 26px; margin-bottom: 12px; }
  .plans-heading .section-title { margin: 0; }
  .section-toggle { color: #fff; background: var(--amber); border-color: var(--amber); }
  .section-toggle:hover { color: #fff; background: #e9630d; }
  .plans-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 13px; padding: 16px; margin-bottom: 25px; }
  .order-row, .plan-row { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 17px 19px; margin-bottom: 10px; box-shadow: 0 3px 12px rgba(22,34,51,.025); }
  .order-row.flagged { border-color: #f0a3a3; background: var(--bg-card); box-shadow: inset 3px 0 #d93636; }
  .order-plan, .plan-name { color: var(--text); }
  .order-meta, .plan-meta { color: var(--text-faint); line-height: 1.6; }
  .plan-price { background: var(--bg); }
  .empty-state { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 64px 20px; color: var(--text-faint); }
  .login-screen { max-width: 410px; margin: clamp(60px, 12vh, 130px) auto; padding: 34px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 18px; box-shadow: 0 16px 50px rgba(22,34,51,.08); }
  .login-screen h1 { color: var(--text); font-size: 25px; letter-spacing: -.7px; }
  .login-screen input { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: var(--font-body); }
  .login-screen button { background: var(--amber); color: #fff; border-radius: 10px; }
  .server-url-hint { color: var(--text-faint); }
  button { transition: background .18s ease, border-color .18s ease, transform .18s ease; }
  button:focus-visible, input:focus-visible { outline: 3px solid rgba(255,116,23,.25); outline-offset: 2px; }

  body[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b1120;
    --bg-card: #121b2d;
    --border: #26344b;
    --amber: #ff8a32;
    --green: #42d6a0;
    --red: #ff7777;
    --text: #edf2fa;
    --text-muted: #a6b2c5;
    --text-faint: #8290a6;
  }
  body[data-theme="dark"] header,
  body[data-theme="dark"] .summary-card,
  body[data-theme="dark"] .plans-heading,
  body[data-theme="dark"] .plans-panel,
  body[data-theme="dark"] .order-row,
  body[data-theme="dark"] .plan-row,
  body[data-theme="dark"] .empty-state,
  body[data-theme="dark"] .login-screen { box-shadow: 0 5px 20px rgba(0,0,0,.14); }
  body[data-theme="dark"] .logout-btn:hover { background: rgba(255,119,119,.1); }
  body[data-theme="dark"] .order-row.flagged { border-color: #74414a; }
  body[data-theme="dark"] .login-screen input { background: var(--bg); color: var(--text); }
  @media (max-width: 640px) {
    .wrap { padding: 14px 12px 36px; }
    header { align-items: flex-start; gap: 15px; padding: 17px; flex-direction: column; }
    header h1 { font-size: 20px; }
    .header-actions { width: 100%; }
    .header-actions button { flex: 1; }
    .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .summary-card { padding: 16px 13px; }
    .summary-card .value { font-size: 18px; }
    .order-row { align-items: flex-start; padding: 13px; }
    .plan-row { grid-template-columns: minmax(0, 1fr) auto; }
    .plan-row > :last-child { grid-column: 1 / -1; }
    .login-screen { margin: 45px 14px; padding: 25px 20px; }
  }

</style>
</head>

<body>

<div id="loginScreen" class="login-screen">
  <h1>Mike Digitals Admin</h1>

  <input
    type="password"
    id="passwordInput"
    placeholder="Admin password"
    autocomplete="current-password"
  />

  <button onclick="login()">View Dashboard</button>

  <div id="loginError" class="login-error"></div>

  <div class="server-url-hint">
    Enter your admin password to access the dashboard.
  </div>
</div>

<div id="dashboard" class="wrap" style="display:none;">

  <header>
    <h1>Mike Digitals — Admin</h1>

    <div class="header-actions">
      <button class="refresh-btn theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Switch dashboard theme">☾ Dark mode</button>
      <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="summary-grid" id="summaryGrid"></div>
  
<section aria-labelledby="plansSectionTitle">
  <div class="plans-heading">
    <div class="section-title" id="plansSectionTitle">Data Plans</div>
    <button
      class="section-toggle"
      id="togglePlansBtn"
      type="button"
      aria-expanded="false"
      aria-controls="plansPanel"
      onclick="togglePlans()"
    >
      Manage Plans <span id="plansToggleIcon" aria-hidden="true">+</span>
    </button>
  </div>

  <div class="plans-panel" id="plansPanel" hidden>
    <div id="plansMessage" role="status" aria-live="polite" style="margin-bottom:10px;"></div>
    <div id="plansList"></div>
  </div>
</section>


  <div class="section-title">Orders needing your attention</div>
  <div id="flaggedOrders"></div>

  <div class="section-title" style="margin-top:20px;">Recent orders</div>
  <div id="ordersList"></div>

</div>

<script>

async function login() {
  const passwordInput = document.getElementById("passwordInput");
  const errEl = document.getElementById("loginError");

  const password = passwordInput.value;

  errEl.textContent = "";

  if (!password) {
    errEl.textContent = "Enter your admin password.";
    return;
  }

  try {
    const response = await fetch("/api/admin/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      credentials: "same-origin",
      body: JSON.stringify({ password })
    });

    if (response.status === 401) {
      errEl.textContent = "Wrong admin password.";
      passwordInput.value = "";
      passwordInput.focus();
      return;
    }

    if (!response.ok) {
      errEl.textContent = "Login failed. Please try again.";
      return;
    }

    // The password is no longer needed in JavaScript.
    passwordInput.value = "";

    await loadData();

  } catch (e) {
    errEl.textContent = "Couldn't reach the server. Please try again.";
  }
}

function fmtNaira(n, decimals = 0) {
  return "₦" + Number(n || 0).toLocaleString("en-NG", {
    minimumFractionDigits: decimals,
    maximumFractionDigits: decimals,
  });
}

function togglePlans() {
  const panel = document.getElementById("plansPanel");
  const button = document.getElementById("togglePlansBtn");
  const icon = document.getElementById("plansToggleIcon");
  const isOpening = panel.hidden;

  panel.hidden = !isOpening;
  button.setAttribute("aria-expanded", String(isOpening));
  icon.textContent = isOpening ? "−" : "+";
}

function applyTheme(theme) {
  const selectedTheme = theme === "dark" ? "dark" : "light";
  document.body.dataset.theme = selectedTheme;
  const button = document.getElementById("themeToggle");
  if (button) {
    button.textContent = selectedTheme === "dark" ? "☀ Light mode" : "☾ Dark mode";
    button.setAttribute("aria-label", selectedTheme === "dark" ? "Switch to light theme" : "Switch to dark theme");
  }
}

function toggleTheme() {
  const nextTheme = document.body.dataset.theme === "dark" ? "light" : "dark";
  applyTheme(nextTheme);
  try { localStorage.setItem("md-admin-theme", nextTheme); } catch (_) {}
}

try {
  applyTheme(localStorage.getItem("md-admin-theme") || "light");
} catch (_) {
  applyTheme("light");
}

function formatDateTime(iso) {
  return new Intl.DateTimeFormat("en-NG", {
    timeZone: "Africa/Lagos",
    weekday: "long",
    day: "numeric",
    month: "numeric",
    year: "2-digit",
    hour: "numeric",
    minute: "2-digit",
    hour12: true,
  }).format(new Date(iso));
}

async function loadData() {
  const errEl = document.getElementById("loginError");
  errEl.textContent = "";

  try {
    const [summaryRes, ordersRes, plansRes] = await Promise.all([
  fetch("/api/admin/summary", {
    credentials: "same-origin"
  }),
  fetch("/api/admin/orders", {
    credentials: "same-origin"
  }),
  fetch("/api/admin/plans", {
    credentials: "same-origin"
  })
]);

    // Session is missing or expired.
    if (summaryRes.status === 401 || ordersRes.status === 401 || plansRes.status === 401) {
      document.getElementById("dashboard").style.display = "none";
      document.getElementById("loginScreen").style.display = "block";

      document.getElementById("passwordInput").value = "";
      errEl.textContent = "Your session has expired. Please log in again.";

      return;
    }

    if (!summaryRes.ok || !ordersRes.ok || !plansRes.ok) {
      errEl.textContent = "Couldn't load dashboard data.";
      return;
    }

    const summary = await summaryRes.json();
    const orders = await ordersRes.json();
    const plans = await plansRes.json();

    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("dashboard").style.display = "block";

    renderSummary(summary);
    renderOrders(orders);
    renderPlans(plans);

  } catch (e) {
    errEl.textContent = "Couldn't reach the server. Please try again.";
  }
}

async function logout() {
  try {
    await fetch("/api/admin/logout", {
      method: "POST",
      credentials: "same-origin"
    });
  } catch (e) {
    // Even if the request fails, return to the login screen.
  }

  document.getElementById("dashboard").style.display = "none";
  document.getElementById("loginScreen").style.display = "block";

  document.getElementById("passwordInput").value = "";
  document.getElementById("loginError").textContent = "";

  document.getElementById("passwordInput").focus();
}

function renderSummary(s) {
  const grid = document.getElementById("summaryGrid");

  grid.innerHTML = `
    <div class="summary-card">
      <div class="label">Total Orders</div>
      <div class="value">${s.totalOrders}</div>
    </div>

    <div class="summary-card">
      <div class="label">Delivered</div>
      <div class="value">${s.deliveredOrders}</div>
    </div>

    <div class="summary-card">
      <div class="label">Revenue</div>
      <div class="value">${fmtNaira(s.totalRevenue)}</div>
    </div>

    <div class="summary-card profit">
      <div class="label">Net Profit</div>
      <div class="value">${fmtNaira(s.totalProfit, 2)}</div>
    </div>

    <div class="summary-card">
      <div class="label">Profit Margin</div>
      <div class="value">${Number(s.profitMargin || 0).toFixed(2)}%</div>
    </div>

    <div class="summary-card review">
      <div class="label">Needs Review</div>
      <div class="value">${s.needsManualReview}</div>
    </div>
  `;
}

function orderRowHtml(o) {
  const statusClass =
    "status-" +
    (o.fulfillmentStatus || "pending").replace("not_started", "pending");

  return `
    <div class="order-row ${o.needsManualReview ? "flagged" : ""}">

      <div class="order-info">
        <div class="order-plan">
          ${o.size} · ${(o.network || "").toUpperCase()} · ${o.mobileNumber}
        </div>

        <div class="order-meta">
          ${formatDateTime(o.createdAt)} · ${o.paystackReference}
        </div>
      </div>

      <div class="order-right">
        <div class="order-profit">
          ${Number(o.profit) >= 0 ? "+" : "−"}${fmtNaira(Math.abs(Number(o.profit) || 0), 2)}
        </div>

        <div class="order-status ${statusClass}">
          ${(o.fulfillmentStatus || "pending").replace("_", " ")}
        </div>
      </div>

    </div>
  `;
}

function renderOrders(orders) {
  const flagged = orders.filter((o) => o.needsManualReview);

  const flaggedEl = document.getElementById("flaggedOrders");

  flaggedEl.innerHTML = flagged.length
    ? flagged.map(orderRowHtml).join("")
    : `<div class="empty-state" style="padding:20px;">
         Nothing needs attention right now.
       </div>`;

  const listEl = document.getElementById("ordersList");

  listEl.innerHTML = orders.length
    ? orders.slice(0, 30).map(orderRowHtml).join("")
    : `<div class="empty-state">
         No orders yet. Once your first customer pays, it'll show up here.
       </div>`;
}


function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, (char) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function renderPlans(plans) {
  const container = document.getElementById("plansList");

  if (!Array.isArray(plans) || plans.length === 0) {
    container.innerHTML =
      '<div class="empty-state">No data plans found.</div>';
    return;
  }

  container.innerHTML = plans.map((plan) => `
    <div class="plan-row" data-plan-id="${escapeHtml(plan.id)}">
      <div class="plan-details">
        <div class="plan-name">
          ${escapeHtml((plan.network || "").toUpperCase())}
          · ${escapeHtml(plan.size)}
        </div>
        <div class="plan-meta">
          ${escapeHtml(plan.validity)} · ID: ${escapeHtml(plan.id)}
        </div>
        <label>
          <input
            class="plan-enabled"
            type="checkbox"
            ${plan.enabled ? "checked" : ""}
          >
          Available for purchase
        </label>
      </div>

      <div>
        <label>
          <span class="plan-meta">Selling price (₦)</span><br>
          <input
            class="plan-price"
            type="number"
            min="1"
            max="1000000"
            step="1"
            value="${Number(plan.sellingPrice)}"
            required
          >
        </label>
      </div>

      <button class="plan-save" type="button" onclick="savePlan(this)">
        Save
      </button>
    </div>
  `).join("");
}

async function savePlan(button) {
  const row = button.closest(".plan-row");
  const message = document.getElementById("plansMessage");
  const planId = row.dataset.planId;
  const priceInput = row.querySelector(".plan-price");
  const enabledInput = row.querySelector(".plan-enabled");
  const price = Number(priceInput.value);

  message.textContent = "";
  message.style.color = "var(--red)";

  if (
    priceInput.value.trim() === "" ||
    !Number.isInteger(price) ||
    price < 1 ||
    price > 1000000
  ) {
    message.textContent =
      "Enter a whole-number price between ₦1 and ₦1,000,000.";
    priceInput.focus();
    return;
  }

  const confirmed = window.confirm(
    `Save changes to ${planId}?\n\n` +
    `Selling price: ${fmtNaira(price)}\n` +
    `Available for purchase: ${enabledInput.checked ? "Yes" : "No"}`
  );

  if (!confirmed) return;

  button.disabled = true;
  button.textContent = "Saving...";

  try {
    const response = await fetch(
      `/api/admin/plans/${encodeURIComponent(planId)}`,
      {
        method: "PATCH",
        credentials: "same-origin",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          sellingPrice: price,
          enabled: enabledInput.checked
        })
      }
    );

    if (response.status === 401) {
      document.getElementById("dashboard").style.display = "none";
      document.getElementById("loginScreen").style.display = "block";
      document.getElementById("passwordInput").value = "";
      document.getElementById("loginError").textContent =
        "Your session has expired. Please log in again.";
      return;
    }

    const result = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(result.error || "Unable to save this plan.");
    }

    message.style.color = "var(--green)";
    message.textContent = `Saved ${planId} successfully.`;

    // Reload the plans to show the values actually saved by the server.
    const plansResponse = await fetch("/api/admin/plans", {
      credentials: "same-origin"
    });

    if (plansResponse.status === 401) {
      document.getElementById("dashboard").style.display = "none";
      document.getElementById("loginScreen").style.display = "block";
      document.getElementById("passwordInput").value = "";
      document.getElementById("loginError").textContent =
        "Your session has expired. Please log in again.";
      return;
    }

    if (!plansResponse.ok) {
      throw new Error("Saved, but couldn't refresh the plan list.");
    }

    renderPlans(await plansResponse.json());
  } catch (err) {
    message.style.color = "var(--red)";
    message.textContent = err.message || "Unable to save this plan.";
  } finally {
    button.disabled = false;
    button.textContent = "Save";
  }
}

</script>

</body>
</html>
