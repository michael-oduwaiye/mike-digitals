<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mike Digitals — Admin</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root {
    --bg: #0A0E1A; --bg-card: #121729; --border: #232B45;
    --amber: #FFB627; --green: #3DDC97; --red: #FF6B6B;
    --text: #E8EAF0; --text-muted: #8B93A7; --text-faint: #4E5670;
    --font-display: 'Space Grotesk', sans-serif; --font-body: 'Inter', sans-serif; --font-mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
  }

  .wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 28px 18px 60px;
  }

  .login-screen {
    max-width: 340px;
    margin: 100px auto;
    text-align: center;
  }

  .login-screen h1 {
    font-family: var(--font-display);
    font-size: 22px;
    margin-bottom: 20px;
  }

  .login-screen input {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 14px;
    color: var(--text);
    font-family: var(--font-mono);
    margin-bottom: 12px;
    outline: none;
  }

  .login-screen input:focus {
    border-color: var(--amber);
  }

  .login-screen button {
    width: 100%;
    background: var(--amber);
    color: #1A1200;
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-family: var(--font-display);
    font-weight: 700;
    cursor: pointer;
  }

  .login-screen button:hover {
    opacity: 0.9;
  }

  .login-error {
    color: var(--red);
    font-size: 13px;
    margin-top: 10px;
  }

  .server-url-hint {
    color: var(--text-faint);
    font-size: 11px;
    margin-top: 18px;
    line-height: 1.5;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }

  header h1 {
    font-family: var(--font-display);
    font-size: 20px;
  }

  .header-actions {
    display: flex;
    gap: 8px;
  }

  .refresh-btn,
  .logout-btn {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }

  .refresh-btn:hover {
    color: var(--text);
    border-color: var(--amber);
  }

  .logout-btn:hover {
    color: var(--red);
    border-color: var(--red);
  }

  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 24px;
  }

  .summary-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }

  .summary-card .label {
    font-size: 11px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }

  .summary-card .value {
    font-family: var(--font-mono);
    font-size: 20px;
    font-weight: 600;
  }

  .summary-card.profit .value {
    color: var(--green);
  }

  .summary-card.review .value {
    color: var(--red);
  }

  .section-title {
    font-family: var(--font-display);
    font-size: 15px;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .order-row {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .order-row.flagged {
    border-color: var(--red);
    background: rgba(255,107,107,0.06);
  }

  .order-info {
    flex: 1;
    min-width: 0;
  }

  .order-plan {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 600;
  }

  .order-meta {
    font-size: 12px;
    color: var(--text-faint);
    margin-top: 3px;
  }

  .order-right {
    text-align: right;
    flex-shrink: 0;
  }

  .order-profit {
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--green);
  }

  .order-status {
    display: inline-block;
    font-size: 10.5px;
    padding: 3px 8px;
    border-radius: 6px;
    margin-top: 4px;
    font-family: var(--font-mono);
  }

  .status-delivered {
    background: rgba(61,220,151,0.12);
    color: var(--green);
  }

  .status-pending {
    background: rgba(255,182,39,0.12);
    color: var(--amber);
  }

  .status-failed,
  .status-partial {
    background: rgba(255,107,107,0.12);
    color: var(--red);
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-faint);
  }

  
.plan-row {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 8px;
  display: grid;
  grid-template-columns: minmax(120px, 1fr) auto auto;
  align-items: center;
  gap: 12px;
}

.plan-name {
  font-weight: 600;
  font-size: 13px;
}

.plan-meta {
  color: var(--text-muted);
  font-size: 12px;
  margin-top: 4px;
}

.plan-price {
  width: 105px;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 9px;
}

.plan-enabled {
  accent-color: var(--green);
}

.plan-save {
  background: var(--amber);
  color: #1A1200;
  border: none;
  border-radius: 7px;
  padding: 9px 12px;
  font-weight: 600;
  cursor: pointer;
}

.plan-save:disabled {
  opacity: 0.5;
  cursor: wait;
}

@media (max-width: 520px) {
  .plan-row {
    grid-template-columns: 1fr auto;
  }

  .plan-details {
    grid-column: 1 / -1;
  }
}


</style>
</head>

<body>

<div id="loginScreen" class="login-screen">
  <h1>Mike Digitals Admin</h1>

  <input
    type="password"
    id="passwordInput"
    placeholder="Admin password"
    autocomplete="current-password"
  />

  <button onclick="login()">View Dashboard</button>

  <div id="loginError" class="login-error"></div>

  <div class="server-url-hint">
    Enter your admin password to access the dashboard.
  </div>
</div>

<div id="dashboard" class="wrap" style="display:none;">

  <header>
    <h1>Mike Digitals — Admin</h1>

    <div class="header-actions">
      <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="summary-grid" id="summaryGrid"></div>
  
<div class="section-title" style="margin-top:20px;">Manage Data Plans</div>
<div id="plansMessage" role="status" style="margin-bottom:10px;"></div>
<div id="plansList"></div>


  <div class="section-title">Orders needing your attention</div>
  <div id="flaggedOrders"></div>

  <div class="section-title" style="margin-top:20px;">Recent orders</div>
  <div id="ordersList"></div>

</div>

<script>

async function login() {
  const passwordInput = document.getElementById("passwordInput");
  const errEl = document.getElementById("loginError");

  const password = passwordInput.value;

  errEl.textContent = "";

  if (!password) {
    errEl.textContent = "Enter your admin password.";
    return;
  }

  try {
    const response = await fetch("/api/admin/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      credentials: "same-origin",
      body: JSON.stringify({ password })
    });

    if (response.status === 401) {
      errEl.textContent = "Wrong admin password.";
      passwordInput.value = "";
      passwordInput.focus();
      return;
    }

    if (!response.ok) {
      errEl.textContent = "Login failed. Please try again.";
      return;
    }

    // The password is no longer needed in JavaScript.
    passwordInput.value = "";

    await loadData();

  } catch (e) {
    errEl.textContent = "Couldn't reach the server. Please try again.";
  }
}

function fmtNaira(n) {
  return "₦" + Number(n).toLocaleString("en-NG");
}

function formatDateTime(iso) {
  return new Intl.DateTimeFormat("en-NG", {
    timeZone: "Africa/Lagos",
    weekday: "long",
    day: "numeric",
    month: "numeric",
    year: "2-digit",
    hour: "numeric",
    minute: "2-digit",
    hour12: true,
  }).format(new Date(iso));
}

async function loadData() {
  const errEl = document.getElementById("loginError");
  errEl.textContent = "";

  try {
    const [summaryRes, ordersRes, plansRes] = await Promise.all([
  fetch("/api/admin/summary", {
    credentials: "same-origin"
  }),
  fetch("/api/admin/orders", {
    credentials: "same-origin"
  }),
  fetch("/api/admin/plans", {
    credentials: "same-origin"
  })
]);

    // Session is missing or expired.
    if (summaryRes.status === 401 || ordersRes.status === 401 || plansRes.status === 401) {
      document.getElementById("dashboard").style.display = "none";
      document.getElementById("loginScreen").style.display = "block";

      document.getElementById("passwordInput").value = "";
      errEl.textContent = "Your session has expired. Please log in again.";

      return;
    }

    if (!summaryRes.ok || !ordersRes.ok || !plansRes.ok) {
      errEl.textContent = "Couldn't load dashboard data.";
      return;
    }

    const summary = await summaryRes.json();
    const orders = await ordersRes.json();
    const plans = await plansRes.json();

    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("dashboard").style.display = "block";

    renderSummary(summary);
    renderOrders(orders);
    renderPlans(plans);

  } catch (e) {
    errEl.textContent = "Couldn't reach the server. Please try again.";
  }
}

async function logout() {
  try {
    await fetch("/api/admin/logout", {
      method: "POST",
      credentials: "same-origin"
    });
  } catch (e) {
    // Even if the request fails, return to the login screen.
  }

  document.getElementById("dashboard").style.display = "none";
  document.getElementById("loginScreen").style.display = "block";

  document.getElementById("passwordInput").value = "";
  document.getElementById("loginError").textContent = "";

  document.getElementById("passwordInput").focus();
}

function renderSummary(s) {
  const grid = document.getElementById("summaryGrid");

  grid.innerHTML = `
    <div class="summary-card">
      <div class="label">Total Orders</div>
      <div class="value">${s.totalOrders}</div>
    </div>

    <div class="summary-card">
      <div class="label">Delivered</div>
      <div class="value">${s.deliveredOrders}</div>
    </div>

    <div class="summary-card">
      <div class="label">Revenue</div>
      <div class="value">${fmtNaira(s.totalRevenue)}</div>
    </div>

    <div class="summary-card profit">
      <div class="label">Profit</div>
      <div class="value">${fmtNaira(s.totalProfit)}</div>
    </div>

    <div class="summary-card review">
      <div class="label">Needs Review</div>
      <div class="value">${s.needsManualReview}</div>
    </div>
  `;
}

function orderRowHtml(o) {
  const statusClass =
    "status-" +
    (o.fulfillmentStatus || "pending").replace("not_started", "pending");

  return `
    <div class="order-row ${o.needsManualReview ? "flagged" : ""}">

      <div class="order-info">
        <div class="order-plan">
          ${o.size} · ${(o.network || "").toUpperCase()} · ${o.mobileNumber}
        </div>

        <div class="order-meta">
          ${formatDateTime(o.createdAt)} · ${o.paystackReference}
        </div>
      </div>

      <div class="order-right">
        <div class="order-profit">
          +${fmtNaira(o.profit)}
        </div>

        <div class="order-status ${statusClass}">
          ${(o.fulfillmentStatus || "pending").replace("_", " ")}
        </div>
      </div>

    </div>
  `;
}

function renderOrders(orders) {
  const flagged = orders.filter((o) => o.needsManualReview);

  const flaggedEl = document.getElementById("flaggedOrders");

  flaggedEl.innerHTML = flagged.length
    ? flagged.map(orderRowHtml).join("")
    : `<div class="empty-state" style="padding:20px;">
         Nothing needs attention right now.
       </div>`;

  const listEl = document.getElementById("ordersList");

  listEl.innerHTML = orders.length
    ? orders.slice(0, 30).map(orderRowHtml).join("")
    : `<div class="empty-state">
         No orders yet. Once your first customer pays, it'll show up here.
       </div>`;
}


function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, (char) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function renderPlans(plans) {
  const container = document.getElementById("plansList");

  if (!Array.isArray(plans) || plans.length === 0) {
    container.innerHTML =
      '<div class="empty-state">No data plans found.</div>';
    return;
  }

  container.innerHTML = plans.map((plan) => `
    <div class="plan-row" data-plan-id="${escapeHtml(plan.id)}">
      <div class="plan-details">
        <div class="plan-name">
          ${escapeHtml((plan.network || "").toUpperCase())}
          · ${escapeHtml(plan.size)}
        </div>
        <div class="plan-meta">
          ${escapeHtml(plan.validity)} · ID: ${escapeHtml(plan.id)}
        </div>
        <label>
          <input
            class="plan-enabled"
            type="checkbox"
            ${plan.enabled ? "checked" : ""}
          >
          Available for purchase
        </label>
      </div>

      <div>
        <label>
          <span class="plan-meta">Selling price (₦)</span><br>
          <input
            class="plan-price"
            type="number"
            min="1"
            max="1000000"
            step="1"
            value="${Number(plan.sellingPrice)}"
            required
          >
        </label>
      </div>

      <button class="plan-save" type="button" onclick="savePlan(this)">
        Save
      </button>
    </div>
  `).join("");
}

async function savePlan(button) {
  const row = button.closest(".plan-row");
  const message = document.getElementById("plansMessage");
  const planId = row.dataset.planId;
  const priceInput = row.querySelector(".plan-price");
  const enabledInput = row.querySelector(".plan-enabled");
  const price = Number(priceInput.value);

  message.textContent = "";
  message.style.color = "var(--red)";

  if (
    priceInput.value.trim() === "" ||
    !Number.isInteger(price) ||
    price < 1 ||
    price > 1000000
  ) {
    message.textContent =
      "Enter a whole-number price between ₦1 and ₦1,000,000.";
    priceInput.focus();
    return;
  }

  const confirmed = window.confirm(
    `Save changes to ${planId}?\n\n` +
    `Selling price: ${fmtNaira(price)}\n` +
    `Available for purchase: ${enabledInput.checked ? "Yes" : "No"}`
  );

  if (!confirmed) return;

  button.disabled = true;
  button.textContent = "Saving...";

  try {
    const response = await fetch(
      `/api/admin/plans/${encodeURIComponent(planId)}`,
      {
        method: "PATCH",
        credentials: "same-origin",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          sellingPrice: price,
          enabled: enabledInput.checked
        })
      }
    );

    if (response.status === 401) {
      document.getElementById("dashboard").style.display = "none";
      document.getElementById("loginScreen").style.display = "block";
      document.getElementById("passwordInput").value = "";
      document.getElementById("loginError").textContent =
        "Your session has expired. Please log in again.";
      return;
    }

    const result = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(result.error || "Unable to save this plan.");
    }

    message.style.color = "var(--green)";
    message.textContent = `Saved ${planId} successfully.`;

    // Reload the plans to show the values actually saved by the server.
    const plansResponse = await fetch("/api/admin/plans", {
      credentials: "same-origin"
    });

    if (plansResponse.status === 401) {
      document.getElementById("dashboard").style.display = "none";
      document.getElementById("loginScreen").style.display = "block";
      document.getElementById("passwordInput").value = "";
      document.getElementById("loginError").textContent =
        "Your session has expired. Please log in again.";
      return;
    }

    if (!plansResponse.ok) {
      throw new Error("Saved, but couldn't refresh the plan list.");
    }

    renderPlans(await plansResponse.json());
  } catch (err) {
    message.style.color = "var(--red)";
    message.textContent = err.message || "Unable to save this plan.";
  } finally {
    button.disabled = false;
    button.textContent = "Save";
  }
}

</script>

</body>
</html>
